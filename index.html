<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>離線配對驗證</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --line:#ccc; --ok:#0a7d32; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --line:#444; --ok:#5fd38a; --bad:#ff8a80; } }
  body { margin:0; padding:16px; font:16px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:16px; margin:16px 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:12px 0; padding:8px 12px; }
  button { font-size:16px; padding:10px 14px; margin:4px 4px 4px 0; border-radius:8px; border:1px solid var(--line); background:transparent; color:inherit; }
  #qr { background:#fff; padding:12px; display:inline-block; margin-top:8px; }
  #qr svg { width:min(88vw, 460px); height:auto; display:block; }
  video { display:block; margin-top:8px; border-radius:8px; }
  #video.preview { width:40vw; max-width:200px; }
  #video.full { width:100%; max-width:460px; }
  #seats div { padding:6px 0; border-bottom:1px solid var(--line); }
  #toast { font-size:20px; font-weight:600; min-height:1.4em; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  #log { white-space:pre-wrap; font:12px/1.35 ui-monospace, monospace; max-height:50vh; overflow:auto; border:1px solid var(--line); padding:8px; border-radius:8px; }
  textarea { width:100%; box-sizing:border-box; font:12px ui-monospace, monospace; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<h1>離線房間配對驗證</h1>
<div class="muted">版本 <span id="ver"></span> · <span id="ua"></span> · SW <span id="sw">?</span> · 網路 <span id="online"></span></div>

<div id="roleBtns">
  <button id="beHost">建立離線房間</button>
  <button id="beGuest">加入離線房間</button>
</div>

<div id="toast"></div>

<div id="qrBox" class="hidden">
  <div id="qrLabel" class="muted"></div>
  <div id="qr"></div>
</div>
<video id="video" class="hidden" playsinline muted></video>
<button id="flipCam" class="hidden">翻轉鏡頭</button>

<div id="slotPick" class="hidden">
  <div>選一個座位（跟其他人講好，不要重複）</div>
  <button data-slot="0">座位 1</button><button data-slot="1">座位 2</button><button data-slot="2">座位 3</button>
</div>
<button id="repick" class="hidden">改選座位</button>

<div id="seats"></div>

<details>
  <summary class="muted">掃不到時手動貼上</summary>
  <textarea id="paste" rows="4"></textarea>
  <button id="pasteGo">使用貼上的內容</button>
  <button id="copyPayload">複製目前 QR 內容</button>
</details>

<h2>紀錄</h2>
<button id="copyLog">複製紀錄</button><button id="clearLog">清除紀錄</button>
<div id="log"></div>

<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
